# PodClatch Server and its Postgres. Needs a root .env (copy .env.example); see README.
name: podclatch

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-podclatch}
      POSTGRES_DB: ${POSTGRES_DB:-podclatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}
    volumes:
      - podclatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: server
      dockerfile: Dockerfile
    image: podclatch-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-podclatch}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}@postgres:5432/${POSTGRES_DB:-podclatch}
      PODCLATCH_TOKEN: ${PODCLATCH_TOKEN:?PODCLATCH_TOKEN is not set - copy .env.example to .env and set it}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Traces and metrics go to the lgtm service below (a base URL; the server adds /v1/traces and
      # /v1/metrics). No depends_on: a slow or failed lgtm never blocks the server.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-podclatch-server}
    ports:
      - "${PODCLATCH_BIND_ADDRESS:-127.0.0.1}:${PODCLATCH_PORT:-8180}:8000"

  # Local telemetry backend (OpenTelemetry Collector, Tempo, Loki, Prometheus, Grafana in one image).
  # Grafana is anonymous-admin, so it is published on loopback only and is deliberately not tied to
  # PODCLATCH_BIND_ADDRESS. The OTLP ports (4317, 4318) are not published; the server reaches them
  # over the Compose network.
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    restart: unless-stopped
    environment:
      # Optional token for the GitHub dispatch contact point (issue #113). Grafana reads it as
      # $__env{GITHUB_DISPATCH_TOKEN}; only this service gets it. Unset is fine: make up works and
      # the dispatch contact point simply fails to authenticate when used.
      GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN:-}
    volumes:
      - podclatch-lgtm-data:/data
      # The alert rule, webhook contact point, and notification policy (US-37), provisioned from files.
      - ./ops/grafana/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    ports:
      - "127.0.0.1:${PODCLATCH_GRAFANA_PORT:-3180}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Test webhook receiver for the Grafana alert (US-37): logs every POST body (docker compose logs
  # alert-receiver) and serves the latest one at GET /last. Standard-library Python, no secret, no
  # internet. Published on loopback only. lgtm does not depend on it, so stopping it never affects
  # the server or `make up --wait`.
  alert-receiver:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/receiver.py"]
    volumes:
      - ./ops/alert-receiver/receiver.py:/app/receiver.py:ro
    ports:
      - "127.0.0.1:${PODCLATCH_ALERT_RECEIVER_PORT:-8280}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  podclatch-pgdata:
  podclatch-lgtm-data:
