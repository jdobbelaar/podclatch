name: Alert dispatch

# Woken by the local Grafana alert (US-37, issue #113) through the GitHub repository_dispatch API.
# The event type is `podclatch-alert`; the client_payload has: status, alertname, severity, service,
# summary, started_at, rule_uid. This is a no-op stub that only proves the dispatch arrived; issue #35
# (US-38) replaces its body with the on-call agent. repository_dispatch only runs workflows that are
# on the default branch.

on:
  repository_dispatch:
    types: [podclatch-alert]

permissions: {}

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - name: Print the event type and alert name
        env:
          EVENT_TYPE: ${{ github.event.action }}
          ALERT_NAME: ${{ github.event.client_payload.alertname }}
          ALERT_STATUS: ${{ github.event.client_payload.status }}
        run: |
          echo "event type: ${EVENT_TYPE}"
          echo "alert name: ${ALERT_NAME}"
          echo "status: ${ALERT_STATUS}"
