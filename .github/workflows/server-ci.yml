name: Server CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check .

  test-postgres:
    # The same suite, with PODCLATCH_TEST_DATABASE_URL set: every test runs against Postgres and
    # the store-contract tests run on both backends. Each test gets its own throwaway schema.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: podclatch
          POSTGRES_PASSWORD: ci-throwaway-password  # a throwaway container; not a secret
          POSTGRES_DB: podclatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U podclatch -d podclatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PODCLATCH_TEST_DATABASE_URL: postgresql://podclatch:ci-throwaway-password@localhost:5432/podclatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Run the tests against Postgres
        run: |
          uv run pytest -v -rs 2>&1 | tee pytest-postgres.log
          # The Postgres tests must have run, not been skipped.
          passed=$(grep -c "\[postgres\] PASSED" pytest-postgres.log)
          echo "Postgres store tests passed: $passed"
          test "$passed" -gt 0
          ! grep -q "PODCLATCH_TEST_DATABASE_URL is not set" pytest-postgres.log
      - run: uv run ruff check .

  compose:
    # Builds the image, starts the whole stack with the same command as `make up`, and smoke-tests
    # it. The token and password are generated at run time and masked; they are not secrets in the
    # repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway .env
        run: |
          token=$(openssl rand -hex 16)
          password=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          printf 'PODCLATCH_TOKEN=%s\nPOSTGRES_PASSWORD=%s\n' "$token" "$password" > .env
      - name: Build and start the stack, waiting for health
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          set -eu
          token=$(sed -n 's/^PODCLATCH_TOKEN=//p' .env)
          body=$(curl -fsS http://localhost:8180/healthz)
          echo "healthz body: $body"
          test "$body" = '{"status":"ok"}'
          authed=$(curl -sS -o feeds.json -w '%{http_code}' -H "Authorization: Bearer $token" http://localhost:8180/v1/feeds)
          echo "authenticated GET /v1/feeds: $authed"
          test "$authed" = 200
          anon=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8180/v1/feeds)
          echo "unauthenticated GET /v1/feeds: $anon"
          test "$anon" = 401
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
