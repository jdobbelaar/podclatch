name: Scripts CI

# Unit tests for the helper scripts the deploy and promote workflows call. They run only when a script
# changes, so an ordinary pull request does not start this job. No AWS account or credential is used.
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-ci.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the script tests
        run: python -m unittest discover -s .github/scripts -v
