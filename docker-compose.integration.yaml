# Integration test overlay: adds a fake feed host and keeps the scheduler quiet. Used only by the
# pytest session in server/tests_integration/, always as the project `podclatch-it`:
#   docker compose -p podclatch-it -f docker-compose.yaml -f docker-compose.integration.yaml up -d --build --wait
services:
  feedhost:
    image: python:3.12-slim
    user: "10001:10001"
    command: ["python", "-u", "/srv/fakehost.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./server/tests_integration/fakehost.py:/srv/fakehost.py:ro
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  server:
    depends_on:
      feedhost:
        condition: service_healthy
    environment:
      REFRESH_INTERVAL_HOURS: "24"
      # Search calls the fake host instead of the real iTunes (only this overlay sets it).
      ITUNES_SEARCH_URL: http://feedhost:8080/search

  # The test stacks do not publish Grafana, so they never collide with the dev stack's port.
  lgtm:
    ports: !reset []

  # The alert test receiver (US-37) is not part of the test stacks: a profile that is never enabled
  # keeps it from starting, and its host port is never taken.
  alert-receiver:
    profiles: ["dev-only"]

  # Likewise the telemetry gateway (US-38a): never started, its host port never taken.
  telemetry-gateway:
    profiles: ["dev-only"]
