AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PodClatch server for one environment: the server image on Amazon ECS Express Mode (Fargate behind
  a managed load balancer, HTTPS address, no domain), PostgreSQL on RDS (TLS forced), and the access
  token, database password, and database URL in Secrets Manager. Deploy as podclatch-dev or
  podclatch-prod from this one file.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: dev or prod. Prod has deletion protection, a final snapshot, and 7 days of backups.
  ImageTag:
    Type: String
    Default: ""
    Description: The tag of the server image the service first starts with. Empty means the environment name (dev or prod). The pipeline later points the service at a commit-SHA tag.
  EcrRepositoryName:
    Type: String
    Default: podclatch-server
    Description: The ECR repository created by the bootstrap stack.
  RefreshIntervalHours:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Hours between the server's scheduled feed refreshes (REFRESH_INTERVAL_HOURS).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC of the region (the README shows the command that finds it).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets of that VPC in different Availability Zones (the default subnets are public).

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsDev: !Equals [!Ref Environment, dev]
  UseDefaultTag: !Equals [!Ref ImageTag, ""]

Resources:
  # ---- Secrets: generated by Secrets Manager, never written in this file or in the repository.
  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "podclatch/${Environment}/token"
      Description: The access token the app sends as its bearer token.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "podclatch/${Environment}/database-password"
      Description: The database password. Letters and digits only, because it goes inside DATABASE_URL.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "podclatch/${Environment}/database-url"
      Description: The complete DATABASE_URL, built from the generated password and the database endpoint.
      SecretString: !Sub
        - "postgresql://podclatch:{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}@${Endpoint}:5432/podclatch?sslmode=require"
        - Endpoint: !If
            - IsProd
            - !GetAtt DatabaseProd.Endpoint.Address
            - !GetAtt DatabaseDev.Endpoint.Address

  # ---- Database: public on purpose (the service's tasks run in public subnets and get public
  # addresses that change, so there is no fixed address to allow), protected by forced TLS and the
  # generated password. See infra/README.md.
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "PodClatch ${Environment} database. PostgreSQL from anywhere; TLS is forced and a password is required."
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: PostgreSQL over TLS

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "PodClatch ${Environment} database subnets"
      SubnetIds: !Ref SubnetIds

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub "PodClatch ${Environment}: refuse connections that do not use TLS"
      Family: postgres17
      Parameters:
        rds.force_ssl: "1"

  DatabaseProd:
    Type: AWS::RDS::DBInstance
    Condition: IsProd
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: podclatch-prod
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: db.t4g.micro
      MultiAZ: false
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: podclatch
      MasterUsername: podclatch
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}"
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true

  DatabaseDev:
    Type: AWS::RDS::DBInstance
    Condition: IsDev
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: podclatch-dev
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: db.t4g.micro
      MultiAZ: false
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: podclatch
      MasterUsername: podclatch
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}"
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true

  # ---- ECS Express Mode: two roles, then the service. The role names are fixed because the
  # bootstrap stack's deploy role is allowed to pass exactly these two roles to ECS (iam:PassRole).
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "podclatch-${Environment}-ecs-execution"
      Description: Lets ECS pull the server image from ECR, write its logs, and inject its two runtime secrets as environment variables.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref TokenSecret
                  - !Ref DatabaseUrlSecret

  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "podclatch-${Environment}-ecs-infrastructure"
      Description: Lets ECS Express Mode create and manage the load balancer, certificate, security groups, and scaling for the service.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices"

  Service:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      ServiceName: !Sub "podclatch-${Environment}"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt InfrastructureRole.Arn
      Cpu: "256" # 0.25 vCPU, the smallest Fargate size
      Memory: "512" # 0.5 GB, the smallest Fargate size
      HealthCheckPath: /healthz
      NetworkConfiguration:
        Subnets: !Ref SubnetIds # public subnets, so the tasks get public addresses and the load balancer is internet-facing
      ScalingTarget:
        MinTaskCount: 1
        MaxTaskCount: 1 # one task: the server runs its own scheduled Refresh, so two copies would repeat it
      PrimaryContainer:
        Image: !Sub
          - "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${EcrRepositoryName}:${Tag}"
          - Tag: !If [UseDefaultTag, !Ref Environment, !Ref ImageTag]
        ContainerPort: 8000
        Environment:
          - Name: REFRESH_INTERVAL_HOURS
            Value: !Ref RefreshIntervalHours
          - Name: LOG_LEVEL
            Value: INFO
        Secrets:
          - Name: PODCLATCH_TOKEN
            ValueFrom: !Ref TokenSecret
          - Name: DATABASE_URL
            ValueFrom: !Ref DatabaseUrlSecret

Outputs:
  ServiceUrl:
    Description: The HTTPS address of the server. Type it into the app as the server URL.
    Value: !Sub "https://${Service.Endpoint}"
  ServiceArn:
    Description: The ECS Express Mode service (the pipeline updates it to move to a new image).
    Value: !GetAtt Service.ServiceArn
  TokenSecretArn:
    Description: The secret that holds the access token (the README shows how to read it).
    Value: !Ref TokenSecret
