AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PodClatch server for one environment: the server image on AWS App Runner (HTTPS address, no
  domain), PostgreSQL on RDS (TLS forced), and the access token, database password, and database
  URL in Secrets Manager. Deploy as podclatch-dev or podclatch-prod from this one file.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: dev or prod. Prod has deletion protection, a final snapshot, and 7 days of backups.
  ImageTag:
    Type: String
    Default: ""
    Description: The tag of the server image App Runner watches. Empty means the environment name (dev or prod).
  EcrRepositoryName:
    Type: String
    Default: podclatch-server
    Description: The ECR repository created by the bootstrap stack.
  RefreshIntervalHours:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Hours between the server's scheduled feed refreshes (REFRESH_INTERVAL_HOURS).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC of the region (the README shows the command that finds it).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets of that VPC in different Availability Zones (the default subnets are public).

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsDev: !Equals [!Ref Environment, dev]
  UseDefaultTag: !Equals [!Ref ImageTag, ""]

Resources:
  # ---- Secrets: generated by Secrets Manager, never written in this file or in the repository.
  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "podclatch/${Environment}/token"
      Description: The access token the app sends as its bearer token.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  DatabasePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "podclatch/${Environment}/database-password"
      Description: The database password. Letters and digits only, because it goes inside DATABASE_URL.
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "podclatch/${Environment}/database-url"
      Description: The complete DATABASE_URL, built from the generated password and the database endpoint.
      SecretString: !Sub
        - "postgresql://podclatch:{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}@${Endpoint}:5432/podclatch?sslmode=require"
        - Endpoint: !If
            - IsProd
            - !GetAtt DatabaseProd.Endpoint.Address
            - !GetAtt DatabaseDev.Endpoint.Address

  # ---- Database: public on purpose (App Runner without a VPC connector has no fixed addresses),
  # protected by forced TLS and the generated password. See infra/README.md.
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "PodClatch ${Environment} database. PostgreSQL from anywhere; TLS is forced and a password is required."
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: PostgreSQL over TLS

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "PodClatch ${Environment} database subnets"
      SubnetIds: !Ref SubnetIds

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub "PodClatch ${Environment}: refuse connections that do not use TLS"
      Family: postgres17
      Parameters:
        rds.force_ssl: "1"

  DatabaseProd:
    Type: AWS::RDS::DBInstance
    Condition: IsProd
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: podclatch-prod
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: db.t4g.micro
      MultiAZ: false
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: podclatch
      MasterUsername: podclatch
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}"
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true

  DatabaseDev:
    Type: AWS::RDS::DBInstance
    Condition: IsDev
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: podclatch-dev
      Engine: postgres
      EngineVersion: "17.6"
      DBInstanceClass: db.t4g.micro
      MultiAZ: false
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: podclatch
      MasterUsername: podclatch
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabasePasswordSecret}:SecretString}}"
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true

  # ---- App Runner: roles, then the service.
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets App Runner pull the server image from ECR.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the running server read its own two runtime secrets, and nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref TokenSecret
                  - !Ref DatabaseUrlSecret

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "podclatch-${Environment}"
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Sub
            - "${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${EcrRepositoryName}:${Tag}"
            - Tag: !If [UseDefaultTag, !Ref Environment, !Ref ImageTag]
          ImageConfiguration:
            Port: "8000"
            RuntimeEnvironmentVariables:
              - Name: REFRESH_INTERVAL_HOURS
                Value: !Ref RefreshIntervalHours
              - Name: LOG_LEVEL
                Value: INFO
            RuntimeEnvironmentSecrets:
              - Name: PODCLATCH_TOKEN
                Value: !Ref TokenSecret
              - Name: DATABASE_URL
                Value: !Ref DatabaseUrlSecret
      InstanceConfiguration:
        Cpu: "256" # 0.25 vCPU, the smallest size
        Memory: "512" # 0.5 GB, the smallest size
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /healthz
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true

Outputs:
  ServiceUrl:
    Description: The HTTPS address of the server. Type it into the app as the server URL.
    Value: !Sub "https://${Service.ServiceUrl}"
  ServiceArn:
    Description: The App Runner service (for pause, resume, and describe).
    Value: !GetAtt Service.ServiceArn
  TokenSecretArn:
    Description: The secret that holds the access token (the README shows how to read it).
    Value: !Ref TokenSecret
