AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PodClatch bootstrap. Creates the GitHub OIDC identity provider (optional), the ECR repository
  podclatch-server, and a least-privilege role the GitHub Actions pipeline assumes. Deployed once
  by the human with admin credentials. Stack name: podclatch-bootstrap.

Parameters:
  GitHubSubjectPrefix:
    Type: String
    Default: "repo:jdobbelaar@7696911/podclatch@1422992323"
    AllowedPattern: "^repo:[A-Za-z0-9_.@-]+(/[A-Za-z0-9_.@-]+)?$"
    Description: >-
      The start of the OIDC subject (sub) claim of the one repository whose workflows may assume the
      deploy role; ":environment:dev" or ":environment:production" is added to it. It must match what
      GitHub sends, which depends on the repository: run
      `gh api repos/<owner>/<name>/actions/oidc/customization/sub` and use `sub_claim_prefix` when
      `use_immutable_subject` is true (the form with numeric owner and repository IDs, used by newer
      repositories), and `repo:<owner>/<name>` otherwise. No wildcards are allowed.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      An AWS account can have only one GitHub OIDC provider. Say false if the account already has
      one, and then fill in ExistingOidcProviderArn.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: The ARN of the existing token.actions.githubusercontent.com provider. Only used when CreateOidcProvider is false.

Rules:
  ExistingProviderArnGiven:
    RuleCondition: !Equals [!Ref CreateOidcProvider, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingOidcProviderArn, ""]]
        AssertDescription: ExistingOidcProviderArn is required when CreateOidcProvider is false.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # No ThumbprintList: AWS verifies the GitHub OIDC certificate chain itself and the property is
  # optional, so there is no thumbprint to keep current.
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: podclatch-server
      ImageTagMutability: MUTABLE # the moving tags dev and prod need this
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[
          {"rulePriority":1,"description":"Keep the images the dev and prod tags point at",
          "selection":{"tagStatus":"tagged","tagPrefixList":["dev","prod"],"countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}},
          {"rulePriority":2,"description":"Keep the last 20 other images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: podclatch-github-deploy
      Description: Assumed by GitHub Actions for the dev and production environments. Pushes and retags images, and points the ECS Express Mode services at a new image.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref OidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub "${GitHubSubjectPrefix}:environment:dev"
                  - !Sub "${GitHubSubjectPrefix}:environment:production"
      Policies:
        - PolicyName: push-and-retag-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*" # this one action does not support resource-level permissions
              - Sid: PushPullAndRetagOneRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
              - Sid: UpdateAndWatchExpressServices
                Effect: Allow
                Action:
                  - ecs:UpdateExpressGatewayService
                  - ecs:DescribeExpressGatewayService
                  - ecs:DescribeServices
                  - ecs:DescribeServiceDeployments
                  - ecs:DescribeServiceRevisions
                  - ecs:ListServiceDeployments
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/default/podclatch-*"
              - Sid: RegisterTaskDefinitions
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*" # Task definition actions do not support resource-level permissions
              - Sid: PassTheTwoExpressRolesToEcs
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/podclatch-*-ecs-execution"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/podclatch-*-ecs-infrastructure"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs.amazonaws.com
                      - ecs-tasks.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Value for the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  EcrRepositoryUri:
    Description: Where the server image is pushed.
    Value: !GetAtt EcrRepository.RepositoryUri
  OidcProviderArn:
    Description: The GitHub OIDC provider the deploy role trusts.
    Value: !If [CreateProvider, !Ref OidcProvider, !Ref ExistingOidcProviderArn]
